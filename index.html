<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order summary component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main">
    <div class="container">
      <img class="hero" src="images/illustration-hero.svg" alt="Illustration of a person listening to music" />

      <div class="content">
        <h1 class="heading">Order Summary</h1>
        <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

        <div class="plan">
          <img src="images/icon-music.svg" alt="Music icon" />
          <div class="plan-text">
            <h2>Annual Plan</h2>
            <p>$59.99/year</p>
          </div>
          <div class="change-link">
            <a href="#">Change</a>
          </div>
        </div>

        <button type="button" class="proceed-btn">Proceed to Payment</button>
        <a href="#" class="cancel-order">Cancel Order</a>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.crio.do" target="_blank" rel="noopener">Crio.Do</a>.
    Coded by
    <a href="https://www.github.com/mihirwankhade10" target="_blank" rel="noopener">Mihir Wankhade</a>.
  </footer>
</body>
</html>
